<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание группы 18</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdf6f0;
            color: #4a3a3a;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 24px 0 20px 0;
            border-bottom: 2px solid #f5c8c8;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            color: #e07a7a;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #f5b8b8, #eaa0a0);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .header p {
            font-size: 14px;
            color: #c9a0a0;
            margin-top: 6px;
            font-weight: 400;
        }

        .day-block {
            background: linear-gradient(145deg, #fff5f0, #fde8e0);
            border-radius: 20px;
            padding: 18px 18px 14px 18px;
            margin-bottom: 16px;
            border: 1.5px solid #f5d0c8;
            box-shadow: 0 6px 20px rgba(235, 160, 150, 0.12);
        }

        .day-title {
            font-size: 18px;
            font-weight: 700;
            color: #d4837a;
            padding-bottom: 10px;
            border-bottom: 2px dashed #f5d6d0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-title .emoji {
            font-size: 20px;
        }

        .pair-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: rgba(255, 248, 245, 0.7);
            border-radius: 14px;
            border-left: 4px solid #f5c0b8;
            font-size: 14px;
            line-height: 1.5;
            color: #4a3a3a;
        }

        .pair-item:last-child {
            margin-bottom: 0;
        }

        .pair-time {
            font-weight: 600;
            color: #d4837a;
            margin-right: 6px;
        }

        .pair-name {
            color: #4a3a3a;
            font-weight: 500;
        }

        .pair-detail {
            font-size: 12px;
            color: #b89a94;
            margin-top: 3px;
            padding-left: 4px;
        }

        .btn-update {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #f5d0c8, #eab8b0);
            color: #6a4a4a;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 16px rgba(235, 160, 150, 0.15);
            letter-spacing: 0.3px;
        }

        .btn-update:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .footer {
            text-align: center;
            padding: 24px 0 10px 0;
            font-size: 12px;
            color: #d0b8b4;
            border-top: 1px solid #f0e0dc;
            margin-top: 16px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #d4837a;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        body.dark .header h1 span {
            background: linear-gradient(135deg, #8a5a5a, #7a4a4a);
        }

        body.dark .day-block {
            background: linear-gradient(145deg, #2a1f1c, #221816);
            border-color: #6a4a44;
        }

        body.dark .pair-item {
            background: rgba(50, 35, 30, 0.6);
            color: #d0c0b8;
        }

        body.dark .pair-name {
            color: #d0c0b8;
        }

        body.dark .pair-detail {
            color: #9a7a74;
        }

        body.dark .day-title {
            color: #e09a8a;
            border-bottom-color: #5a3a34;
        }

        body.dark .pair-time {
            color: #e09a8a;
        }

        body.dark .header {
            border-bottom-color: #4a3a34;
        }

        body.dark .header p {
            color: #8a6a64;
        }

        body.dark .btn-update {
            background: linear-gradient(145deg, #6a4a44, #5a3a34);
            color: #d0b8b0;
        }

        body.dark .footer {
            color: #6a5a54;
            border-top-color: #3a2a24;
        }

        body.dark .footer a {
            color: #e09a8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>📚 ГРУППА 18</span></h1>
            <p>3 курс • Расписание занятий</p>
        </div>

        <div id="schedule-container">
            <div style="text-align:center;padding:40px 20px;color:#c9a0a0;font-size:16px;">
                ⏳ Загрузка расписания...
            </div>
        </div>

        <button class="btn-update" onclick="loadSchedule()">🔄 Обновить расписание</button>

        <div class="footer">
            Данные с сайта <a href="https://fir.bsu.by" target="_blank">fir.bsu.by</a>
        </div>
    </div>

    <script>
        async function loadSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c9a0a0;font-size:16px;">⏳ Загрузка...</div>';

            try {
                const response = await fetch('https://your-api-url.com/schedule');
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c9a0a0;font-size:16px;">❌ Расписание не найдено</div>';
                    return;
                }

                let html = '';
                for (const day of data) {
                    html += `
                        <div class="day-block">
                            <div class="day-title"><span class="emoji">📅</span> ${day.day}</div>
                            ${day.pairs.map(p => `
                                <div class="pair-item">
                                    <div><span class="pair-time">${p.time}</span> — <span class="pair-name">${p.name}</span></div>
                                    ${p.detail ? `<div class="pair-detail">${p.detail}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;color:#c9a0a0;font-size:16px;">
                        ❌ Ошибка загрузки<br>
                        <small style="font-size:12px;color:#d0b8b4;">${error.message}</small>
                    </div>
                `;
            }
        }

        loadSchedule();

        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.colorScheme === 'dark') {
            document.body.classList.add('dark');
        }
    </script>
</body>
</html>
